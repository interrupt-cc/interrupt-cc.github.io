<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERRUPT_CC // DEVLOG</title>
    <meta name="description" content="Bare-metal rust, digital instruments, and beaglebone adventures.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Folded post/devlog window: collapse to the title bar only.
           The frame (and whatever it was playing) stays loaded underneath. */
        #post-window { transition: height 0.4s ease; overflow: hidden; }
        #post-window.folded { height: 36px !important; min-height: 0; }
        #post-window.folded #post-frame { display: none; }
        #fold-overlay { font-size: 0.75rem; }
        /* Tagline as a block pinned to the top of the page, above the sky */
        #tagline-block {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 600; pointer-events: none;
            font-style: italic; color: var(--dim-color); letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--dim-color);
            padding: 6px 20px;
        }
        #tagline-block .tagline-title {
            font-style: normal; font-weight: 700;
            color: var(--text-color); margin-left: 14px; letter-spacing: 4px;
        }
    </style>
</head>

<body>
    <div id="tagline-block">divide by zero<span class="tagline-title">INTERRUPT</span></div>
    <canvas id="horizon-grid"></canvas>
    <canvas id="crt-media"></canvas>
    <canvas id="crt-static"></canvas>
    <div class="gutter">
        <header>
            <div class="intro">
                <div class="nav-links">
                    <a href="#" id="cv-link" class="post-link">[ CV ]</a>
                    <a href="#" id="music-link" class="post-link">[ SONICS ]</a>
                    <a href="#" id="devlog-link" class="post-link">[ AI_NOTES ]</a>
                </div>
            </div>
        </header>


    </div>

    <div id="post-overlay">
        <div class="window" id="post-window">
            <div class="window-header" id="window-handle">
                <span class="window-title">POST</span>
                <span style="display: flex; gap: 6px; align-items: center;">
                    <button id="fold-overlay" class="hacker-btn">[ − ]</button>
                    <button id="close-overlay" class="hacker-btn">[ CLOSE ]</button>
                </span>
            </div>
            <iframe id="post-frame" src=""></iframe>
        </div>
    </div>

    <canvas id="crt-lines"></canvas>
    <div id="signal-input-container">
        <span class="signal-prompt">[SIGNAL_OUT]: >></span>
        <input type="text" id="signal-broadcast" placeholder="..." autocomplete="off">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script>
        // Global Hardware State (Shared across all modules)
        window.CRT_CONFIG = {
            pinch: 0.15,
            'p-interval': 4,
            'p-random': 0.5,
            noise: 0.25,
            freq: 4,
            snap: 1.8,
            bleed: 0.2,
            trails: 0.3,
            stoch: 0.4,
            'c-buffer': 0.15,
            'g-bunch': 0.45,
            'g-falloff': 0.5,
            'g-alpha': 0.3,
            'boost-contrast': 0
        };
    </script>
    <script src="js/static.js"></script>
    <script src="js/media-manifest.js"></script>
    <script src="js/media-stochastic.js"></script>
    <script src="js/lines.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/horizon.js"></script>
    <script src="js/tracklist.js"></script>
    <script src="js/audio-core.js"></script>
    <script src="js/stochastic-player.js"></script>
    <script src="js/music-window.js"></script>
    <script src="js/system-calibrate.js"></script>
    <script>
        // Global CRT Configuration
        window.CRT_CONFIG = {
            pinch: 0.15,
            'p-interval': 4,
            'p-random': 0.5,
            noise: 0.25,
            freq: 4,
            snap: 1.8,
            bleed: 0.35,
            trails: 0.45,
            stoch: 0.55,
            'c-buffer': 0.15,
            'g-bunch': 0.45,
            'g-falloff': 0.15,
            'g-alpha': 0.4
        };

        window.addEventListener('message', (event) => {
            if (event.data.type === 'CRT_UPDATE') {
                window.CRT_CONFIG = { ...window.CRT_CONFIG, ...event.data.config };
            }
        });

        document.querySelectorAll('.post-link').forEach(link => {
            link.addEventListener('click', (e) => {
                const url = link.getAttribute('href');
                if (!url || url === '#') return;
                e.preventDefault();
                const overlay = document.getElementById('post-overlay');
                const frame = document.getElementById('post-frame');
                const win = document.getElementById('post-window');
                const title = document.querySelector('.window-title');
                
                title.textContent = 'POST';
                frame.src = url;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';

                // Center window
                const winW = win.offsetWidth || 800;
                const winH = win.offsetHeight || 600;
                win.style.left = (window.innerWidth / 2 - winW / 2) + 'px';
                win.style.top = (window.innerHeight / 2 - winH / 2) + 'px';
                win.style.transform = 'none';
            });
        });

        // DEVLOG Link Handler — its own window, same mechanism as CV
        document.getElementById('devlog-link').addEventListener('click', (e) => {
            e.preventDefault();
            const overlay = document.getElementById('post-overlay');
            const frame = document.getElementById('post-frame');
            const win = document.getElementById('post-window');
            const title = document.querySelector('.window-title');

            title.textContent = 'AI_NOTES';
            frame.src = 'posts/index.html';
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            const winW = win.offsetWidth || 800;
            const winH = win.offsetHeight || 600;
            win.style.left = (window.innerWidth / 2 - winW / 2) + 'px';
            win.style.top = (window.innerHeight / 2 - winH / 2) + 'px';
            win.style.transform = 'none';
        });

        // CV Link Handler
        document.getElementById('cv-link').addEventListener('click', (e) => {
            e.preventDefault();
            const overlay = document.getElementById('post-overlay');
            const frame = document.getElementById('post-frame');
            const win = document.getElementById('post-window');
            const title = document.querySelector('.window-title');
            
            title.textContent = 'CV::READ_MANIFEST';
            frame.src = 'cv.html';
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Center window
            const winW = win.offsetWidth || 800;
            const winH = win.offsetHeight || 600;
            win.style.left = (window.innerWidth / 2 - winW / 2) + 'px';
            win.style.top = (window.innerHeight / 2 - winH / 2) + 'px';
            win.style.transform = 'none';
        });

        document.getElementById('close-overlay').addEventListener('click', () => {
            document.getElementById('post-overlay').classList.remove('active');
            document.getElementById('post-frame').src = '';
            document.body.style.overflow = '';
        });

        // Fold: collapse the window to its title bar. The frame stays loaded,
        // so an open devlog (or its audio) is exactly where you left it.
        document.getElementById('fold-overlay').addEventListener('click', () => {
            const w = document.getElementById('post-window');
            const f = document.getElementById('fold-overlay');
            const folded = w.classList.toggle('folded');
            f.textContent = folded ? '[ + ]' : '[ − ]';
        });

        // Draggable Logic
        const win = document.getElementById('post-window');
        const handle = document.getElementById('window-handle');
        let isDragging = false;
        let startX, startY, initialX, initialY;

        function dragStart(e) {
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            const rect = win.getBoundingClientRect();
            // Handle touch vs mouse payload
            startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            initialX = rect.left;
            initialY = rect.top;

            win.style.transform = 'none';
            win.style.left = initialX + 'px';
            win.style.top = initialY + 'px';
            win.style.cursor = 'grabbing';
            
            // Prevent scrolling underlying page while dragging
            if(e.type.includes('touch')) e.preventDefault();
        }

        function dragMove(e) {
            if (!isDragging) return;
            // Handle touch vs mouse payload
            const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            win.style.left = (initialX + (currentX - startX)) + 'px';
            win.style.top = (initialY + (currentY - startY)) + 'px';
        }

        function dragEnd() {
            isDragging = false;
            win.style.cursor = 'auto';
        }

        // Bind Mouse
        handle.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);

        // Bind Touch
        handle.addEventListener('touchstart', dragStart, {passive: false});
        document.addEventListener('touchmove', dragMove, {passive: false});
        document.addEventListener('touchend', dragEnd);

        // Gravity Spike Trigger
        function triggerSpike() {
            const overlay = document.getElementById('post-overlay');
            if (overlay.classList.contains('active')) {
                win.classList.remove('gravity-spike');
                void win.offsetWidth; // Force reflow
                win.classList.add('gravity-spike');
            }
            setTimeout(triggerSpike, 4000 + Math.random() * 8000);
        }
        triggerSpike();
    </script>
</body>

</html>
