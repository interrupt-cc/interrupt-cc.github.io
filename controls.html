<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 2rem; background: transparent; color: var(--text-color); }
        .control-group { margin-bottom: 2rem; }
        label { display: block; font-size: 0.7rem; color: var(--dim-color); margin-bottom: 0.8rem; letter-spacing: 2px; }
        input[type="range"] { 
            width: 100%; 
            appearance: none; 
            background: rgba(0, 229, 255, 0.1); 
            height: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--text-color);
            border: 1px solid var(--bg-color);
            cursor: pointer;
            box-shadow: var(--glow-shadow);
        }
        .header { border-bottom: 1px solid var(--dim-color); margin-bottom: 2rem; padding-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="header">
        <span class="window-title">SYSTEM::CRT_CALIBRATION_V1.0</span>
    </div>
    
    <div class="control-group">
        <label>GEOMETRY_PINCH [<span id="pinch-val">0.15</span>]</label>
        <input type="range" id="pinch" min="0" max="0.8" step="0.01" value="0.15">
    </div>

    <div class="control-group">
        <label>NOISE_FLOOR [<span id="noise-val">0.25</span>]</label>
        <input type="range" id="noise" min="0" max="1" step="0.01" value="0.25">
    </div>

    <div class="control-group">
        <label>BURST_INTERVAL [<span id="freq-val">18</span>s]</label>
        <input type="range" id="freq" min="5" max="60" step="1" value="18">
    </div>

    <div class="control-group">
        <label>SNAP_INTENSITY [<span id="snap-val">1.8</span>]</label>
        <input type="range" id="snap" min="1" max="4" step="0.1" value="1.8">
    </div>

    <script>
        const ids = ['pinch', 'noise', 'freq', 'snap'];
        function broadcast() {
            const config = {};
            ids.forEach(id => {
                const val = document.getElementById(id).value;
                document.getElementById(id + '-val').innerText = val;
                config[id] = parseFloat(val);
            });
            window.parent.postMessage({ type: 'CRT_UPDATE', config }, '*');
        }

        ids.forEach(id => {
            document.getElementById(id).addEventListener('input', broadcast);
        });
        
        // Initial broadcast
        window.addEventListener('load', broadcast);
    </script>
</body>
</html>
