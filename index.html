<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERRUPT_CC // DEVLOG</title>
    <meta name="description" content="Bare-metal rust, digital instruments, and beaglebone adventures.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="crt-static"></canvas>
    <div class="gutter">
        <header>
            <div class="intro">
                <p>Infinite as the result of division by zero.</p>
                <p>This interface defines Eternal as a single fixed time...</p>
            </div>
            <h1>INTERRUPT</h1>
        </header>

        <main>
            <section class="feed">
                <ul class="post-list">
                    <li class="post-item">
                        <span class="post-id">0x0</span>
                        <a href="posts/4k_pages_of_pain.html" class="post-link">4k pages of pain</a>
                        <span class="post-date">2026-03-31</span>
                    </li>
                    <li class="post-item" style="border-top: 1px dashed var(--dim-color); padding-top: 2rem; margin-top: 3rem;">
                        <span class="post-id">0xX</span>
                        <a href="controls.html" class="post-link">SYSTEM_CALIBRATE</a>
                        <span class="post-date">CALIBRATION_REQUIRED</span>
                    </li>
                </ul>
            </section>
        </main>

        <footer>
            <p>[ ACCESS_LOG: SUCCESS ]</p>
        </footer>
    </div>

    <div id="post-overlay">
        <div class="window" id="post-window">
            <div class="window-header" id="window-handle">
                <span class="window-title">POST::READ_SYSTEM</span>
                <button id="close-overlay" class="hacker-btn">[ CLOSE ]</button>
            </div>
            <iframe id="post-frame" src=""></iframe>
        </div>
    </div>

    <script src="static.js"></script>
    <script>
        // Global CRT Configuration
        window.CRT_CONFIG = {
            pinch: 0.15,
            'p-interval': 4,
            'p-random': 0.5,
            noise: 0.25,
            freq: 4,
            snap: 1.8
        };

        window.addEventListener('message', (event) => {
            if (event.data.type === 'CRT_UPDATE') {
                window.CRT_CONFIG = { ...window.CRT_CONFIG, ...event.data.config };
            }
        });

        document.querySelectorAll('.post-link').forEach(link => {
            link.addEventListener('click', (e) => {
                const url = link.getAttribute('href');
                if (!url) return;
                e.preventDefault();
                const overlay = document.getElementById('post-overlay');
                const frame = document.getElementById('post-frame');
                const win = document.getElementById('post-window');
                
                frame.src = url;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                
                // Immediately calculate absolute pixel centering to avoid transform conflicts
                const winW = win.offsetWidth || 800; // Expected width
                const winH = win.offsetHeight || 600; // Expected height
                win.style.left = (window.innerWidth / 2 - winW / 2) + 'px';
                win.style.top = (window.innerHeight / 2 - winH / 2) + 'px';
                win.style.transform = 'none';
            });
        });

        document.getElementById('close-overlay').addEventListener('click', () => {
            document.getElementById('post-overlay').classList.remove('active');
            document.getElementById('post-frame').src = '';
            document.body.style.overflow = '';
        });

        // Draggable Logic
        const win = document.getElementById('post-window');
        const handle = document.getElementById('window-handle');
        let isDragging = false;
        let startX, startY, initialX, initialY;

        handle.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            const rect = win.getBoundingClientRect();
            startX = e.clientX;
            startY = e.clientY;
            initialX = rect.left;
            initialY = rect.top;
            
            win.style.transform = 'none';
            win.style.left = initialX + 'px';
            win.style.top = initialY + 'px';
            win.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            win.style.left = (initialX + (e.clientX - startX)) + 'px';
            win.style.top = (initialY + (e.clientY - startY)) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            win.style.cursor = 'auto';
        });

        // Gravity Spike Trigger
        function triggerSpike() {
            const overlay = document.getElementById('post-overlay');
            if (overlay.classList.contains('active')) {
                win.classList.remove('gravity-spike');
                void win.offsetWidth; // Force reflow
                win.classList.add('gravity-spike');
            }
            setTimeout(triggerSpike, 4000 + Math.random() * 8000);
        }
        triggerSpike();
    </script>
</body>

</html>
