<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERRUPT_CC // DEVLOG</title>
    <meta name="description" content="Bare-metal rust, digital instruments, and beaglebone adventures.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Folded post/devlog window: collapse to the title bar only.
           The frame (and whatever it was playing) stays loaded underneath. */
        #post-window { transition: height 0.4s ease; overflow: hidden; }
        #post-window.folded { height: var(--pw-header-h, 50px) !important; min-height: 0; }
        #post-window.folded #post-frame { display: none; }
        #fold-overlay { font-size: 0.75rem; }
        /* One shared window for CV / AI_NOTES / SONICS.
           SONICS mode hides the iframe+chrome and shows the music DOM,
           whose own header becomes the window header. */
        /* Pass-through overlay: nav links and the page stay clickable while
           the window is open; only the window itself catches clicks. */
        #post-overlay.active { pointer-events: none; }
        #post-overlay.active #post-window { pointer-events: auto; }
        #sonics-mount { display: none; position: absolute; inset: 0; }
        #post-window.sonics #sonics-mount { display: block; }
        #post-window.sonics > .window-header,
        #post-window.sonics > #post-frame { display: none; }
        #post-window:not(.sonics) #sonics-mount { visibility: hidden; }
        /* Whole-page window header: title row + nav links row, one block at
           the top of the screen, styled like a window title bar. */
        #page-header {
            position: fixed; top: 0; left: 0; right: 0;
            /* above the shared window (z 10000): the nav links must stay
               clickable even while the window is open and overlapping */
            z-index: 10001; pointer-events: auto;
            background: rgba(0, 10, 12, 0.92);
            border-bottom: 1px solid var(--dim-color);
            padding: 8px 16px 10px;
        }
        #page-header .ph-title {
            font-style: italic; color: var(--dim-color); letter-spacing: 2px;
            padding-bottom: 8px;
        }
        #page-header .ph-title .tagline-title {
            font-style: normal; font-weight: 700;
            color: var(--text-color); margin-left: 14px; letter-spacing: 4px;
        }
        #page-header .nav-links { margin: 0; }
        #page-header .nav-links a { text-decoration: none; }
    </style>
</head>

<body>
    <!-- Refraction filter for the wave grid: feTurbulence generates a slow
         wavy displacement field, feDisplacementMap warps the backdrop so
         content beneath the grid (the fall, media) looks seen through water. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="grid-refract" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise">
          <animate attributeName="seed" from="0" to="100" dur="60s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="page-header">
        <div class="ph-title">divide by zero<span class="tagline-title">INTERRUPT</span></div>
        <div class="nav-links">
            <a href="#" id="cv-link" class="post-link">[ CV ]</a>
            <a href="#" id="music-link" class="post-link">[ SONICS ]</a>
            <a href="#" id="devlog-link" class="post-link">[ AI_NOTES ]</a>
        </div>
    </div>
    <canvas id="horizon-grid"></canvas>
    <canvas id="crt-media"></canvas>
    <canvas id="crt-static"></canvas>

    <div id="post-overlay">
        <div class="window" id="post-window">
            <div class="window-header" id="window-handle">
                <span class="window-title">POST</span>
                <span style="display: flex; gap: 6px; align-items: center;">
                    <button id="close-overlay" class="hacker-btn">[ CLOSE ]</button>
                </span>
            </div>
            <iframe id="post-frame" src=""></iframe>
            <div id="sonics-mount"></div>
        </div>
    </div>

    <canvas id="crt-lines"></canvas>
    <div id="signal-input-container">
        <span class="signal-prompt">[SIGNAL_OUT]: >></span>
        <input type="text" id="signal-broadcast" placeholder="..." autocomplete="off">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script>
        // Global Hardware State (Shared across all modules)
        window.CRT_CONFIG = {
            pinch: 0.15,
            'p-interval': 4,
            'p-random': 0.5,
            noise: 0.25,
            freq: 4,
            snap: 1.8,
            bleed: 0.2,
            trails: 0.3,
            stoch: 0.4,
            'c-buffer': 0.15,
            'g-bunch': 0.45,
            'g-falloff': 0.5,
            'g-alpha': 0.3,
            'boost-contrast': 0
        };
    </script>
    <script src="js/static.js"></script>
    <script src="js/media-manifest.js"></script>
    <script src="js/media-stochastic.js"></script>
    <script src="js/lines.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/horizon.js"></script>
    <script src="js/tracklist.js"></script>
    <script src="js/audio-core.js"></script>
    <script src="js/stochastic-player.js"></script>
    <script src="js/music-window.js"></script>
    <script src="js/system-calibrate.js"></script>
    <script>
        // Global CRT Configuration
        window.CRT_CONFIG = {
            pinch: 0.15,
            'p-interval': 4,
            'p-random': 0.5,
            noise: 0.25,
            freq: 4,
            snap: 1.8,
            bleed: 0.35,
            trails: 0.45,
            stoch: 0.55,
            'c-buffer': 0.15,
            'g-bunch': 0.45,
            'g-falloff': 0.15,
            'g-alpha': 0.4
        };

        window.addEventListener('message', (event) => {
            if (event.data.type === 'CRT_UPDATE') {
                window.CRT_CONFIG = { ...window.CRT_CONFIG, ...event.data.config };
            }
        });

        // The page header owns the very top: push the wave-grid canvas below
        // it (never shrunk), same as the sky visualizer.
        function dropBelowHeader() {
            const hh = document.getElementById('page-header').offsetHeight;
            document.getElementById('horizon-grid').style.top = hh + 'px';
        }
        dropBelowHeader();
        window.addEventListener('resize', dropBelowHeader);

        // folded post window collapses to its real title-bar height
        function sizeFoldedPost() {
            const h = Math.ceil(document.getElementById('window-handle').offsetHeight) + 1;
            document.getElementById('post-window').style.setProperty('--pw-header-h', h + 'px');
        }
        requestAnimationFrame(sizeFoldedPost);

        // One shared window for all three pages. A link toggles: click the
        // page that's already open -> close the window; click another ->
        // swap the content inside the same window.
        window.APP = (function () {
            let currentPage = null;
            function center() {
                const win = document.getElementById('post-window');
                const winW = win.offsetWidth || 800;
                const winH = win.offsetHeight || 600;
                const headerH = document.getElementById('page-header').offsetHeight + 8;
                win.style.left = (window.innerWidth / 2 - winW / 2) + 'px';
                win.style.top = Math.max(headerH, window.innerHeight / 2 - winH / 2) + 'px';
                win.style.transform = 'none';
            }
            function toggle(id) {
                const overlay = document.getElementById('post-overlay');
                const win = document.getElementById('post-window');
                const frame = document.getElementById('post-frame');
                const titleEl = document.querySelector('#post-window .window-title');

                if (overlay.classList.contains('active') && currentPage === id) {
                    return close();
                }
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                win.classList.remove('folded');

                if (id === 'sonics') {
                    win.classList.add('sonics');
                    if (window.MUSIC) window.MUSIC.mount();
                } else {
                    win.classList.remove('sonics');
                    titleEl.textContent = id === 'cv' ? 'CV::READ_MANIFEST' : 'AI_NOTES';
                    if (frame.src.indexOf(id === 'cv' ? 'cv.html' : 'posts/index.html') === -1) {
                        frame.src = id === 'cv' ? 'cv.html' : 'posts/index.html';
                    }
                }
                currentPage = id;
                center();
            }
            function close() {
                document.getElementById('post-overlay').classList.remove('active');
                document.body.style.overflow = '';
                currentPage = null;
            }
            function toggleFold() {
                const w = document.getElementById('post-window');
                w.classList.toggle('folded');
            }
            return { toggle, close, toggleFold, currentPage: () => currentPage };
        })();

        document.getElementById('cv-link').addEventListener('click', (e) => { e.preventDefault(); window.APP.toggle('cv'); });
        document.getElementById('devlog-link').addEventListener('click', (e) => { e.preventDefault(); window.APP.toggle('ai'); });
        document.getElementById('music-link').addEventListener('click', (e) => { e.preventDefault(); window.APP.toggle('sonics'); });

        document.getElementById('close-overlay').addEventListener('click', () => window.APP.close());

        // Double-clicking the window header collapses / expands the window.
        document.getElementById('window-handle').addEventListener('dblclick', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            window.APP.toggleFold();
        });

        // Draggable Logic
        const win = document.getElementById('post-window');
        const handle = document.getElementById('window-handle');
        let isDragging = false;
        let startX, startY, initialX, initialY;

        function dragStart(e) {
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            const rect = win.getBoundingClientRect();
            // Handle touch vs mouse payload
            startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            initialX = rect.left;
            initialY = rect.top;

            win.style.transform = 'none';
            win.style.left = initialX + 'px';
            win.style.top = initialY + 'px';
            win.style.cursor = 'grabbing';
            
            // Prevent scrolling underlying page while dragging
            if(e.type.includes('touch')) e.preventDefault();
        }

        function dragMove(e) {
            if (!isDragging) return;
            // Handle touch vs mouse payload
            const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            win.style.left = (initialX + (currentX - startX)) + 'px';
            win.style.top = (initialY + (currentY - startY)) + 'px';
        }

        function dragEnd() {
            isDragging = false;
            win.style.cursor = 'auto';
        }

        // Bind Mouse
        handle.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);

        // Bind Touch
        handle.addEventListener('touchstart', dragStart, {passive: false});
        document.addEventListener('touchmove', dragMove, {passive: false});
        document.addEventListener('touchend', dragEnd);

        // Gravity Spike Trigger
        function triggerSpike() {
            const overlay = document.getElementById('post-overlay');
            if (overlay.classList.contains('active')) {
                win.classList.remove('gravity-spike');
                void win.offsetWidth; // Force reflow
                win.classList.add('gravity-spike');
            }
            setTimeout(triggerSpike, 4000 + Math.random() * 8000);
        }
        triggerSpike();
    </script>
</body>

</html>
